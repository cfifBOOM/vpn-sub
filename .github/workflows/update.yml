name: Обновление подписки

on:
  schedule:
    - cron: "23 */3 * * *"   # каждые 3 часа
  workflow_dispatch:          # кнопка «Run workflow» во вкладке Actions
  push:
    branches: [main]
    paths:
      - "build/**"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: update-subscription
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Скачать источники
        run: python3 build/fetch.py _src

      - name: Собрать подписку
        run: python3 build/build.py _src out

      - name: Опубликовать в ветку sub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b sub
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Обновление $(TZ=Europe/Moscow date '+%d.%m.%Y %H:%M') МСК"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" sub
